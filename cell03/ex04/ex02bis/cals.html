<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>It's over 9000</title>
    <link rel="stylesheet" href="calc.css">
    <!-- 1. ดึง jQuery CDN เข้ามาก่อน -->
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
    <!-- 2. ดึงไฟล์ JS ของเรา -->
    <script src="cal.js"></script>
</head>
<body>
    <div class="calculator">
        <input type="text" id="left-op" placeholder="Left operand">
        <select id="operator">
            <option value="+">+</option>
            <option value="-">-</option>
            <option value="*">*</option>
            <option value="/">/</option>
            <option value="%">%</option>
        </select>
        <input type="text" id="right-op" placeholder="Right operand">
        <input type="submit" id="btn-submit" value="Try me!">
    </div>
</body>
</html>
