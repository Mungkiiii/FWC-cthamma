<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>It's over 9000</title>
    <link rel="stylesheet" href="calc.css">
</head>
<body>
    <div class="calculator">
        <input type="text" id="left-op" placeholder="Left operand">
        <select id="operator">
            <option value="+">+</option>
            <option value="-">-</option>
            <option value="*">*</option>
            <option value="/" style="display:none;"></option> 
            <option value="/">/</option>
            <option value="%">%</option>
        </select>
        <input type="text" id="right-op" placeholder="Right operand">
        <input type="submit" id="btn-submit" value="Try me!">
    </div>

    <script src="cal.js"></script>
</body>
</html>
