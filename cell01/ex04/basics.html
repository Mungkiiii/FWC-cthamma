<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Basics</title>
    <style>
        body {
            background-color: pink;
            margin: 0;
            padding: 20px;
        }
        h1 {
            color: white;
            text-align: center;
        }
        .shop-container {
            display: flex;
            justify-content: center;

        }
        .shop-item {
            text-align: center;
        }
        .shop-item img {
            width: 200px;
            height: 150px;
            object-fit: cover;
        }
        .footer {
            text-align: right;
            font-style: italic;
            font-family: monospace;
            margin-top: 10px;
        }
    </style>
</head>
<body>

    <h1>Welcome to My Shop &starf;</h1>

    <div class="shop-container">
        <div class="shop-item">
            <img src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcSMBDpwFBCOfPpqy4tN3SMQbekaoY6LXU8QpDgVgk8P4w&s=10" alt="Shop 1">
            <br>
            <a href="https://www.amazon.com" target="_blank">Amazon</a>
        </div>
        <div class="shop-item">
            <img src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcRwlqHmyGFU8cYqhR4K4AnFzE_6dy1KSYUfHx6e1XpF-B_c3KONMElzOOo&s=10" alt="Shop 2">

    </div>

</html>
